<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lovely System</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ecdf;
      --ink: #17130d;
      --line: #a78d67;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(720px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 8vw, 5.8rem);
      line-height: .95;
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 1.25rem 0 2.4rem;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-style: italic;
    }

    nav {
      display: grid;
      gap: .8rem;
      margin: 0 auto;
      width: min(420px, 100%);
    }

    a {
      display: block;
      padding: .95rem 1rem;
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      font-size: 1.2rem;
      background: rgba(255,255,255,.32);
    }

    a:hover,
    a:focus-visible {
      background: rgba(255,255,255,.72);
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>OUR LOVELY SYSTEM</h1>
    <p class="subtitle">A work of expression.</p>

    <nav aria-label="Our Lovely System contexts">
      <a href="https://progress.ourlovelysystem.org/">Progress</a>
      <a href="https://sanctum.ourlovelysystem.org/">Sanctum</a>
      <a href="/policy/">Privacy Policy</a>
    </nav>

    <footer>
      Our Lovely System<br>
      Public = experience.
    </footer>
  </main>
</body>
</html>
