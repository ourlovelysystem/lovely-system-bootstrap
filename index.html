<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Daly Diligence LLC Bootstrap</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      width: min(90%, 720px);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 2rem;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      min-width: 8rem;
      padding: 1rem 2rem;
      border: 2px solid #111;
      border-radius: 0.4rem;
      color: #111;
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 700;
    }

    a:hover,
    a:focus {
      background: #111;
      color: #fff;
    }
  </style>
</head>

<body>
  <main>
    <h1>
      Are you willing to answer questions
      to help me create an institution?
    </h1>

    <div class="choices">
      <a href="https://bootstrap.ourlovelysystem.org/">
        YES
      </a>

      <a href="no.html">
        NO
      </a>
    </div>
  </main>
</body>
</html>
