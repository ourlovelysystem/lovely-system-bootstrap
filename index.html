<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lovely System Bootstrap</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d9c39b;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
    }

    .poster {
      position: relative;
      width: min(100vw, calc(100vh * 2 / 3));
      aspect-ratio: 2 / 3;
      background: #d9c39b;
    }

    .poster img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .choice {
      position: absolute;
      top: 88.2%;
      height: 8.5%;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
      border-radius: 0.5rem;
    }

    .choice:focus-visible {
      outline: 4px solid #1f5eff;
      outline-offset: 3px;
    }

    .yes {
      left: 12.2%;
      width: 35.0%;
    }

    .no {
      left: 53.1%;
      width: 35.0%;
    }

    @media (max-aspect-ratio: 2 / 3) {
      .poster {
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Our Lovely System bootstrap invitation">
    <img
      src="bootstrap-beholder.png"
      alt="Beauty lies within the eye of the beholder. Behold. Describe what you see. Shape the future of My Lovely System so that Our Lovely System can emerge from this humble beginning. Will you help meus?"
    >

    <a
      class="choice yes"
      href="https://terms.ourlovelysystem.org"
      aria-label="Yes"
    >YES</a>

    <a
      class="choice no"
      href="no.html"
      aria-label="No"
    >NO</a>
  </main>
</body>
</html>
